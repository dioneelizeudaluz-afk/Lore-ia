<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Assistente de IA para criar, editar, aplicar e publicar projetos.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lore-IA">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <title>Lore-IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        #splash-screen.hide { display: none; }
        .splash-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .splash-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }
        .splash-title {
            font-size: 24px;
            font-weight: bold;
            color: #8b5cf6;
            margin-bottom: 8px;
        }
        .splash-subtitle {
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            padding: 0 30px;
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-logo">
            <img src="/logo.png" alt="Lore-IA" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:40px;font-weight:bold;color:white;\'>L</div>';">
        </div>
        <div class="splash-title">Lore-IA</div>
        <div class="splash-subtitle">Seu código. Sua IA. Seu projeto.</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            if (splash) splash.classList.add('hide');
        }, 2000);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
        }
    </script>
</body>
    </html>
